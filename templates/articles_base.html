<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5faf9">
    <meta name="description" content="{{ meta_description }}">
    <title>{{ page_title }}</title>
    <link rel="canonical" href="{{ request.base_url }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/botfav.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/" aria-label="CareGuide home">
                <span class="brand-mark" aria-hidden="true">+</span>
                <span>CareGuide</span>
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mainNavigation" aria-label="Open navigation">
                <span></span><span></span><span></span>
            </button>
            <nav class="site-nav" id="mainNavigation" aria-label="Main navigation">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/screening">Cancer symptom check</a>
                <a class="nav-link" href="/#regular-symptoms">Regular symptom checker</a>
                <a class="nav-link" href="/articles" aria-current="page">Articles</a>
                <a class="nav-link" href="/about">About</a>
                <a class="nav-link nav-link--admin" href="/login">Admin login</a>
            </nav>
        </div>
    </header>

    <main class="page-shell article-shell" id="main">
        {% block article_content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <a class="brand brand--footer" href="/">CareGuide</a>
            <p>General health information for educational use.</p>
            <a href="/about">About this project</a>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='articles.js') }}" defer></script>
</body>
</html>
